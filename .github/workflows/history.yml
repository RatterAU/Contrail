# Past flights for the app (tools/history.py): turn adsb.lol's openly licensed history dump for yesterday into small
# per-aircraft shards on GitHub Pages. Nothing is committed: earlier days are carried over from the live site. adsb.lol
# publishes one dump a day, around 03:30 UTC, and GitHub starts scheduled runs late (hours, at busy times), so several
# runs are queued: the first to find the new dump processes it (about 6 minutes), the rest find nothing new and stop
# without deploying. Any of the last 14 days still missing (a late dump, or the first run) are filled in the same run.
name: Past flights

on:
  schedule:
    - cron: "47 3 * * *"
    - cron: "17 5 * * *"
    - cron: "23 7 * * *"
    - cron: "41 11 * * *"
    - cron: "13 17 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: Reprocess all 14 days instead of carrying them over (after changing tools/history.py)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/history.py
            app/src/main/assets/airports.tsv
          sparse-checkout-cone-mode: false

      # Published routes by callsign (VRS standing-data, CC0), for ends the plane wasn't seen at; only the routes folder.
      - name: Routes
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/vradarserver/standing-data.git vrs
          git -C vrs sparse-checkout set routes

      - name: Build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTES: vrs/routes
        run: |
          set -euo pipefail
          python3 tools/history.py test
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" -q .html_url)
          mkdir -p site/d
          if [ "${{ inputs.rebuild }}" != true ]; then
            for i in $(seq 1 14); do
              d=$(date -u -d "-$i day" +%F)
              curl -fsS -o "site/d/$d.tsv.gz" "${site%/}/d/$d.tsv.gz" || rm -f "site/d/$d.tsv.gz"
            done
          fi
          # Every day of the last 14 not yet processed, oldest first. A run started by hand always republishes.
          new=${{ github.event_name == 'workflow_dispatch' && 1 || 0 }}
          for i in $(seq 14 -1 1); do
            day=$(date -u -d "-$i day" +%F)
            [ -f "site/d/$day.tsv.gz" ] && continue
            repo=adsblol/globe_history_${day:0:4}
            tag=$(gh release list -R "$repo" --limit 100 --json tagName -q "[.[].tagName | select(test(\"^v${day//-/.}-planes-readsb-prod-[0-9]+\$\"))][0] // empty")
            if [ -z "$tag" ]; then echo "No dump yet for $day"; continue; fi
            echo "Processing $day ($tag)"
            # Streamed: the ~4 GB tar never touches the disk. A failed day is skipped and retried tomorrow.
            # name:bytes per part, so each trace's byte range can be recorded for the apps to fetch on tap.
            parts=$(gh release view "$tag" -R "$repo" --json assets -q '.assets[] | "\(.name):\(.size)"' | sort)
            for part in $(echo "$parts" | cut -d: -f1); do
              curl -fsSL "https://github.com/$repo/releases/download/$tag/$part"
            done | python3 tools/history.py legs "$(date -u -d "$day" +%s)" "site/d/$day.tsv.gz" "$tag" "$(echo "$parts" | paste -sd, -)" \
              && new=1 || { rm -f "site/d/$day.tsv.gz"; echo "::warning::$day failed, will retry next run"; }
          done
          echo "deploy=$new" >> "$GITHUB_OUTPUT"
          [ "$new" = 1 ] || { echo "Nothing new"; exit 0; }
          ls site/d | sort | head -n -14 | sed 's|^|site/d/|' | xargs -r rm
          python3 tools/history.py shards site/d site
          touch site/.nojekyll
          du -sh site

      - if: steps.build.outputs.deploy == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        if: steps.build.outputs.deploy == '1'
        uses: actions/deploy-pages@v4
